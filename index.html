<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabsandtabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet">    <script src="https://cdn.jsdelivr.net/npm/vanilla-disintegrate@latest/dist/vanilla-disintegrate.iife.min.js"></script>
    <style>
        * {
            font-family: system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        #tint {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        .focus {
            animation: focus linear 1s;
        }
        @keyframes focus {
            0% {
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(20px);
            }
            100% {
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(2px);
            }
        }

        #dateview {
            padding-top: 10ch;
            text-align: center;
            color: white;
        }
        #clock, #date {
            font-family: "Barrio", system-ui, sans-serif;
        }
        #clock {
            font-weight: bolder;
            font-size: 10vh;
        }
        #date {
            font-size: 3vh;
        }
    </style>

</head>
<body>
    <div id="tint" class="focus">
        <div id="dateview">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
    </div>
    <script defer>
        const effects = new VanillaDisintegrate.Disintegrator({ preset: 'scatter' });
        function picsum() {
            let url = `https://picsum.photos/${window.outerWidth}/${window.outerHeight}?salt=${Math.ceil(Math.random() * 1024)}`;
            let tint = document.querySelector("#tint");
            tint.classList.remove("focus");
            let promise = new Promise((resolve, reject) => {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    tint.classList.add("focus");
                    document.body.style.backgroundImage = `url(${url})`;
                    resolve(img);
                };
                img.onerror = (err) => { reject(err); };
            });
            
            return promise;
        }
        function loaddate() {
            let clock = document.querySelector("#clock");
            let date = document.querySelector("#date");
            let d = new Date();
            date.innerText = d.toLocaleDateString();
            clock.innerText = d.toLocaleTimeString();
        }
        function main() {
        }
        picsum();
        loaddate();
        effects.restore(document.querySelector("#dateview"));
        setInterval(picsum, 10000);
        setInterval(loaddate, 1000);
        setTimeout(main, 300);
    </script>
</body>
</html>
